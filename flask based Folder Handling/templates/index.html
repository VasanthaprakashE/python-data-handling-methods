<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Data Upload Portal</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    background:linear-gradient(135deg,#0f172a,#1e3a8a,#312e81);
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:Segoe UI;
}

.upload-card{

    width:650px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border-radius:25px;
    padding:50px;
    color:white;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);

}

.upload-area{

    border:3px dashed rgba(255,255,255,.35);
    border-radius:20px;
    padding:60px;
    cursor:pointer;
    transition:.3s;

}

.upload-area:hover{

    background:rgba(255,255,255,.05);

}

button{

    margin-top:30px;
    width:100%;
    font-size:20px;
    padding:15px;

}

h1{

    font-weight:700;
}
.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 48
}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=folder_open" />
</head>
<body>

<div class="upload-card">

<h1><span class="material-symbols-outlined", style="font-size:60px; vertical-align:middle;">
folder_open</span>
</span> Upload Folder</h1>

<p class="mb-4">
Upload CSV, Excel and JSON files.
</p>

<form action="/upload" method="POST" enctype="multipart/form-data">

<label class="upload-area">

<h2>📁 Choose Folder</h2>

<input
type="file"
name="files"
webkitdirectory
multiple
hidden
onchange="document.getElementById('count').innerHTML=this.files.length+' files selected';">

<div id="count">
No folder selected
</div>

</label>

<button class="btn btn-primary">
Upload & Analyze
</button>

</form>

</div>

</body>
</html>
