<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Data Analytics Dashboard</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{

    background:linear-gradient(135deg,#eef2ff,#f8fafc);
    min-height:100vh;

}

/* Header */

.header{

    background:linear-gradient(135deg,#2563eb,#6d28d9);
    color:white;
    padding:35px 0;
    box-shadow:0 10px 25px rgba(0,0,0,.15);

}

.logo{

    font-size:52px;
    vertical-align:middle;
    margin-right:10px;

}

.header h1{

    font-weight:700;

}

.header p{

    opacity:.9;

}

/* Cards */

.stats-card{

    border:none;
    border-radius:18px;
    background:white;
    transition:.3s;
    box-shadow:0 12px 25px rgba(0,0,0,.08);

}

.stats-card:hover{

    transform:translateY(-6px);
    box-shadow:0 18px 35px rgba(0,0,0,.15);

}

.icon{

    font-size:45px;
    color:#2563eb;

}

.number{

    font-size:34px;
    font-weight:bold;

}

/* Search */

.search-box{

    border-radius:50px;
    overflow:hidden;
    box-shadow:0 5px 20px rgba(0,0,0,.08);

}

/* Table */

.table-card{

    border:none;
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 12px 30px rgba(0,0,0,.08);

}

.table-responsive{

    max-height:650px;
    overflow:auto;

}

.table{

    margin-bottom:0;
    font-size:14px;

}

.table thead th{

    position:sticky;
    top:0;
    background:#2563eb !important;
    color:white;
    z-index:100;

}

.table tbody tr:hover{

    background:#eef4ff;

}

.footer{

    text-align:center;
    color:#6b7280;
    padding:25px;

}

</style>

</head>

<body>

<!-- Header -->

<div class="header">

<div class="container">

<h1>

<span class="material-symbols-outlined logo">
dashboard
</span>

Data Analytics Dashboard

</h1>

<p class="mt-2">

Upload • Combine • Analyze • Visualize

</p>

</div>

</div>

<div class="container my-5">

<!-- KPI Cards -->

<div class="row g-4">

<div class="col-lg-4">

<div class="card stats-card p-4">

<div class="d-flex justify-content-between align-items-center">

<div>

<h6 class="text-muted">Total Rows</h6>

<div class="number">{{ rows }}</div>

</div>

<span class="material-symbols-outlined icon">

table_rows

</span>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card stats-card p-4">

<div class="d-flex justify-content-between align-items-center">

<div>

<h6 class="text-muted">Total Columns</h6>

<div class="number">{{ columns }}</div>

</div>

<span class="material-symbols-outlined icon">

view_column

</span>

</div>

</div>

</div>

<div class="col-lg-4">

<div class="card stats-card p-4">

<div class="d-flex justify-content-between align-items-center">

<div>

<h6 class="text-muted">Files Combined</h6>

<div class="number">{{ files }}</div>

</div>

<span class="material-symbols-outlined icon">

folder_zip

</span>

</div>

</div>

</div>

</div>

<!-- Search -->

<div class="input-group search-box my-5">

<span class="input-group-text bg-white border-0">

<span class="material-symbols-outlined">

search

</span>

</span>

<input

id="search"

type="text"

class="form-control border-0"

placeholder="Search entire dataset...">

</div>

<!-- Table -->

<div class="card table-card">

<div class="card-header bg-white">

<h4 class="mb-0">

<span class="material-symbols-outlined align-middle">

dataset

</span>

Combined Dataset

</h4>

</div>

<div class="table-responsive">

{{ table|safe }}

</div>

</div>

</div>

<div class="footer">

Built with ❤️ using Flask + Pandas

</div>

<script>

const input=document.getElementById("search");

input.addEventListener("keyup",()=>{

const value=input.value.toLowerCase();

const rows=document.querySelectorAll("tbody tr");

rows.forEach(row=>{

const text=row.innerText.toLowerCase();

row.style.display=text.includes(value)?"":"none";

});

});

</script>

</body>

</html>
